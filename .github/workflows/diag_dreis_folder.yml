name: Diagnostico pasta nova Dreis (temp)

on:
  workflow_dispatch:

env:
  RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE_CONFIG }}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash
      - name: List folder contents
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_SECRET" > ~/.config/rclone/rclone.conf
          echo "=== conteudo da pasta 1RPkDs-xNvpf7MLYvXYKFcZUfAdUqI3zd ==="
          rclone lsjson "gdrive:" --drive-root-folder-id "1RPkDs-xNvpf7MLYvXYKFcZUfAdUqI3zd" --recursive
